      var dt = st.last ? Math.min(.05, (ts - st.last) / 1000) : .016, k = 1 - Math.exp(-dt * 7); st.last = ts; st.t += dt;
      if (st.mode === 'spin'){ st.ang += 360 / 4.6 * dt; st.tl += (.07 - st.tl) * k; }
      else {
        var tg = st.mode === 'sway' ? st.tgt + 8 * Math.sin(st.t * 1.6) : st.tgt;
        if (st.mode === 'front'){                                                         // 정해 둔 시간(st.dur)에 맞춰 앞면까지 — 끝이 부드럽게
          var u = Math.min(1, (st.t - st.t0) / st.dur), ez = 1 - Math.pow(1 - u, 3); st.ang = st.from + (st.tgt - st.from) * ez;
          if (u >= 1){ st.ang = st.tgt = 0; st.mode = 'still'; }
        } else st.ang += (tg - st.ang) * (st.mode === 'sway' ? 1 - Math.exp(-dt * 4) : k);
        st.tl += (0 - st.tl) * k;
      }
      st.p += (st.pT - st.p) * (1 - Math.exp(-dt * 22)); if (st.pT >= 1 && st.p > .995) st.p = 1;
      st.ga += (st.gaT - st.ga) * k;
      if (st.flying) st.fly = Math.min(1, st.fly + dt / .7);
      draw();
      if (o.onFrame) o.onFrame(st.ang);
      st.raf = requestAnimationFrame(tick);
    }
    var api = {
      mode: function(m){
        if (m === 'front'){ st.tgt = Math.ceil((st.ang - 6) / 360) * 360; st.from = st.ang; st.t0 = st.t; st.dur = .45 + Math.max(0, st.tgt - st.ang) / 360 * .65; st.mode = m; return Math.round(st.dur * 1000); }   // 도는 방향 그대로 다음 앞면까지. 걸리는 시간(ms)을 돌려준다
        else if (m === 'sway' || m === 'still'){ st.ang = ((st.ang + 180) % 360 + 360) % 360 - 180; st.tgt = 0; }
        if (m === 'sway') st.t = 0;
        st.mode = m; return 0;
      },
      cut: function(p, dir){ st.pT = Math.max(0, Math.min(1, p)); if (dir) st.dir = dir < 0 ? -1 : 1; st.gaT = st.pT > 0 ? .35 + .65 * st.pT : 0; },
      glow: function(hex){ st.glow = rgb(hex); },
      fly: function(){ st.pT = 1; st.flying = true; st.gaT = 1; },
      angle: function(){ return st.ang; },
      destroy: function(){ if (st.dead) return; st.dead = true; if (st.raf) cancelAnimationFrame(st.raf); try { var x = gl.getExtension('WEBGL_lose_context'); if (x) x.loseContext(); } catch (e){} }
    };
    draw(); st.raf = requestAnimationFrame(tick);
    return api;
  }
  window.SGPack = { create: create, CW: CW, CH: CH };
})();

<script>
(function(){
  var UNTIL = 1791448980000, MEMBERS = [{ k: 'wn', n: '원이', c: '#f286a8' }, { k: 'lv', n: '리브', c: '#76d4c8' }, { k: 'mn', n: '미나미', c: '#eec06a' }, { k: 'my', n: '메이', c: '#9ec2f0' }, { k: 'jn', n: '제나', c: '#fca2c4' }], U = { MEMBERS: MEMBERS }, SHOW = 5, S = null, PKG = null, T = [];
  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var body = document.querySelector('.tz-body');
  function q(s){ return document.querySelector(s); }
  function later(f, ms){ T.push(setTimeout(f, ms)); }
  function stop(){ T.forEach(clearTimeout); T = []; }
  function msg(t){ var m = q('.rv2-msg'); if (m) m.innerHTML = t; }
  function phase(p){ if (S) S.ph = p; var s = q('.rv2-stage'); if (s) s.setAttribute('data-ph', p); }
  function light(){}
  function packHTML(m){ return '<div class="rv2-packw"><span class="rv2-shd"></span><div class="rv2-pfl"><canvas class="rv2-gl" width="8" height="8"></canvas><div class="rv2-pack" style="--mc:' + m.c + '"><span class="rv2-flat"><b>SEASON 2</b><i>' + m.n + '</i></span></div></div></div>'; }
  function doorHTML(){
    return '<div class="rv-door"><div class="rv-halo"></div><div class="rv-bk"><i class="ry"></i><i class="bm l"></i><i class="bm c"></i><i class="bm r"></i></div><div class="rv-top"><span class="rv-bar l"></span><span class="rv-bar r"></span><b>DAILY</b><small>SEASON 2</small><span class="rv-led"></span></div>'
      + '<div class="rv-cyl"><div class="rv-rot" style="transform:rotateY(20deg)"><i style="--k:0"></i><i style="--k:1"></i><i style="--k:2"></i><i style="--k:3"></i></div><span class="rv-gl l"></span><span class="rv-gl r"></span></div><div class="rv-base"></div><div class="rv-floor"></div></div>';
  }
  function packStart(m){
    var cv = q('.rv2-gl'), shd = q('.rv2-shd');
    if (PKG){ PKG.destroy(); PKG = null; }
    PKG = window.SGPack ? window.SGPack.create(cv, { tint: m.c, name: m.n, count: SHOW, onFrame: function(a){ if (shd && shd.isConnected) shd.style.transform = 'scaleX(' + (.3 + .7 * Math.abs(Math.cos(a * Math.PI / 180))).toFixed(3) + ')'; } }) : null;
    if (!PKG){ cv.style.display = 'none'; q('.rv2-pack').classList.add('flat'); }
  }
  function dispense(){
    var m = U.MEMBERS[S.m], area = q('.rv2-area'), booth = q('.rv2-booth');
    area.innerHTML = packHTML(m); packStart(m); light(S.lv, false);
    var w = q('.rv2-packw');
    function shown(){
      q('.rv2-booth').classList.remove('go');
      area.style.zIndex = area.style.clipPath = area.style.transition = ''; var sh0 = q('.rv2-lsh'); if (sh0) sh0.remove();
      phase('show'); q('.rv2-pack').classList.add('show'); if (PKG) PKG.mode('spin');
      msg('<b>' + m.n + '</b> 카드팩이 나왔어요!');
      q('.rv2-act').innerHTML = '<button type="button" class="rv2-btn" data-tz-again="1">다시 보기</button>';
    }
    if (RM || !w.animate){ phase('drop'); later(shown, 250); return; }
    var br = booth.getBoundingClientRect(), pr = w.getBoundingClientRect(), ar = area.getBoundingClientRect(), lr = q('.rv2-bt-tray i').getBoundingClientRect(), sc = .5, D = 2250;
    var lip = lr.bottom - ar.top, kp = parseFloat(q('.rv2-stage').style.getPropertyValue('--kp')) || -320;      // lip = 덮개 아랫변(바닥 칸 기준) · kp = 부스가 위로 밀리는 거리
    var dx = br.left + br.width / 2 - (pr.left + pr.width / 2), y0 = (lr.bottom - 3) - pr.height * sc / 2 - (pr.top + pr.height / 2), pk2 = 62 + (br.bottom - lr.bottom);   // 처음: 팩 아랫변이 덮개 바로 위(다 숨음) → 부스 아랫변 밑으로 62px 내밀기
    function clip(y){ return 'inset(' + y.toFixed(1) + 'px -80px -80px -80px)'; }
    area.style.zIndex = '3'; area.style.clipPath = clip(lip);
    var sh = document.createElement('i'); sh.className = 'rv2-lsh'; sh.style.cssText = 'left:' + (lr.left - ar.left).toFixed(1) + 'px;width:' + lr.width.toFixed(1) + 'px;top:' + lip.toFixed(1) + 'px'; area.appendChild(sh);
    function T(y, k, r){ return 'translate(' + dx.toFixed(0) + 'px,' + y.toFixed(0) + 'px) scale(' + k + ') rotate(' + (r || 0) + 'deg)'; }
    w.animate([
      { transform: T(y0, sc, 0), offset: 0, easing: 'cubic-bezier(.2,.7,.3,1)' },
      { transform: T(y0 + pk2, sc, -3), offset: .2 },
      { transform: T(y0 + pk2 - 7, sc, 2.5), offset: .29 },
      { transform: T(y0 + pk2 + 5, sc, -1.5), offset: .4, easing: 'cubic-bezier(.5,0,.6,1)' },
      { transform: 'translate(0px,16px) scale(1.04) rotate(1deg)', offset: .84, easing: 'ease-out' },
      { transform: 'translate(0px,-7px) scale(.99) rotate(0deg)', offset: .93 },
      { transform: 'translate(0px,0px) scale(1) rotate(0deg)', offset: 1 }
    ], { duration: D });
    later(function(){                                                                   // 떨어지기 시작할 때 화면이 따라 내려간다 — 자르는 선 · 덮개 그늘도 부스와 같이 올라간다
      area.style.transition = 'clip-path .95s cubic-bezier(.45,0,.2,1)'; area.style.clipPath = clip(lip + kp); sh.style.transform = 'translateY(' + kp + 'px)';
      phase('drop');
    }, D * .4);
    later(shown, D + 60);
  }
  function fit(){
    var st = q('.rv2-stage'), k = q('.rv2-kiosk'), dw = q('.rv2-doorw'); if (!st || !k) return;
    var h0 = Math.ceil(Math.max(k.getBoundingClientRect().height, 364) + 14 + 118);
    st.style.setProperty('--h0', h0 + 'px'); st.style.setProperty('--oy', '0px'); st.style.height = h0 + 'px';
    st.style.setProperty('--kp', (-(dw.getBoundingClientRect().height - 4)).toFixed(0) + 'px');
  }
  function closed(){ stop(); if (PKG){ PKG.destroy(); PKG = null; } S = null; body.innerHTML = '<div class="tz-end"><b>미리보기가 끝났습니다.</b><span>봐 주셔서 감사합니다. 시즌 2는 준비가 끝나면 사이트에서 알려 드리겠습니다.</span></div>'; }
  function stage(){
    stop(); S = null; if (PKG){ PKG.destroy(); PKG = null; }
    body.innerHTML = '<div class="rv2-stage" data-ph="door"><div class="rv2-floor"></div><div class="rv2-kiosk"><div class="rv2-doorw">' + doorHTML() + '</div>'
      + '<div class="rv2-booth"><div class="rv2-bt-hd"><span class="rv2-bt-scr"><b>CARD PACK</b></span><span class="rv2-bt-lp"><i></i><i></i><i></i></span></div><div class="rv2-bt-tray"><i></i></div></div></div>'
      + '<div class="rv2-area"></div><div class="rv2-foot"><p class="rv2-msg">단추를 누르면 부스에서 카드팩이 나옵니다.</p><div class="rv2-act"><button type="button" class="rv2-btn" data-tz-go="1">카드팩 받기</button></div></div></div>'
      + (UNTIL ? '<p class="tz-t">이 미리보기는 ' + new Date(UNTIL).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' }) + '에 닫힙니다.</p>' : '');
    fit();
  }
  function go(){
    if (S) return;
    var mi = Math.floor(Math.random() * MEMBERS.length), m = MEMBERS[mi], k = q('.rv2-kiosk');
    S = { m: mi, lv: 0, ph: 'spin' };
    k.style.setProperty('--mc', m.c); k.classList.add('on'); q('.rv2-bt-scr b').textContent = m.n;
    phase('spin'); q('.rv2-act').innerHTML = ''; msg('<b>' + m.n + '</b> 카드팩이 나옵니다!'); q('.rv2-booth').classList.add('go');
    later(dispense, RM ? 100 : 520);
  }
  document.addEventListener('click', function(e){
    if (UNTIL && Date.now() >= UNTIL){ closed(); return; }
    if (e.target.closest('[data-tz-go]')) go(); else if (e.target.closest('[data-tz-again]')) stage();
  });
  window.addEventListener('resize', function(){ if (!S && q('.rv2-stage')) fit(); });
  if (UNTIL && Date.now() >= UNTIL) closed();
  else { stage(); if (UNTIL) setTimeout(closed, Math.min(2147483000, UNTIL - Date.now())); }
})();
</script>
