<script>
// 데일리 회전문 뽑기 시즌 2 — 카드팩 3D (WebGL) · **임시 작업 전용: 라이브 빌드에 들어가지 않는다**(build.js 가 SG_STAGE=1 일 때만 revolve-s2.js 앞에 넣는다)
//   10/8 사용자 "3D 가 허접함. 2D 평면을 여러 개 이어서 만든 것 같은데 … 3D 입체를 구현해 줬으면" → CSS 로 판을 이어 붙이던 것을 버리고 WebGL 로 진짜 입체를 그린다(라이브러리 없이 이 파일만).
//   모양: 가로 W · 세로 H 의 베개 모양 봉지. 위아래는 납작하게 봉한 띠(위 13% · 아래 7%), 그 사이 몸통은 가운데가 D px 볼록하고 양옆 가장자리에서 앞뒤가 만난다(pt). 앞 · 뒤 두 면을 촘촘한 격자로 만든다(mesh).
//     윗띠(자르는 선 위)는 몸통과 꼭짓점을 따로 둔다 — 잘려 나갈 때 몸통이 따라 늘어나지 않게.
//   자르기(정점 셰이더): uCut(0~1)만큼 잘린 윗띠가 자른 자리에서부터 보는 사람 쪽으로 말려 올라가고, 입구(자른 선 바로 아래 몸통)가 살짝 벌어진다. uFly = 다 잘린 띠가 날아가며 사라짐.
//   빛(조각 셰이더): 금속 박 = 주변(스튜디오 조명 몇 개를 식으로 흉내 낸 env)이 비치는 반사 × 멤버 색. 구김(잡음으로 법선을 흔듦 — 봉한 곳 가까이에서 세게) · 봉한 띠의 잔 세로 주름 · 보는 각에 따라 지나가는 무지개(홀로그램)
//     · 인쇄(이름표 · 자르는 선 · 뒷면 이음선 — 2D canvas 로 그린 그림을 텍스처로) · 안쪽 면은 은빛 + 틈새 빛 색. 위아래 끝은 톱니 모양으로 잘라 낸다.
//   좌표: 화면 px 그대로(z = 0 인 곳의 1 = CSS 1px). 카메라는 CAM px 앞 — CSS perspective 와 같은 원근. canvas 는 팩(200 × 292)보다 넉넉하게 CW × CH 로, 가운데가 팩 가운데.
//   쓰는 법(revolve-s2.js): var pk = SGPack.create(canvas, { tint: '#f286a8', name: '원이', count: 5, onFrame: function(각도){} }) — 안 되면 null(그때는 납작한 대체 모양).
//     pk.turn(각도) = 각도를 바깥에서 정함('hold') · pk.set({ tint, name }) = 멤버 바꾸기(팔각별 뽑기 revolve-s2-star.js — 10/17)
//     pk.mode('spin' 계속 돈다 | 'front' 가장 가까운 앞면으로 돌아와 멈춤 | 'sway' 좌우로 살짝 | 'still') · pk.cut(p, dir) · pk.glow('#색') · pk.fly() · pk.destroy(). canvas 가 문서에서 빠지면 스스로 멈추고 정리한다
(function(){
  var W = 200, H = 292, D = 19, VT = .74, VB = -.86, CAM = 900, CW = 340, CH = 440, NU = 44;
  function fu(u){ return Math.pow(Math.max(0, 1 - u * u), .6); }
  function gv(v){ var t = (v - VB) / (VT - VB); return t <= 0 || t >= 1 ? 0 : Math.pow(Math.sin(Math.PI * t), .62); }
  function pt(u, v, sd){ var g = gv(v); return [u * W / 2 * (1 - .03 * g), v * H / 2, sd * D * fu(u) * g]; }
  function sub(a, b){ return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function cross(a, b){ return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function norm(a){ var l = Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  var MESH = null;
  function mesh(){
    if (MESH) return MESH;
    var V = [], I = [], base = 0;
    [1, -1].forEach(function(sd){
      [[-1, VT, 62, 1], [VT, 1, 9, 2]].forEach(function(pc){                              // 몸통(아래 띠 포함) · 윗띠 — 꼭짓점 묶음을 따로
        var v0 = pc[0], v1 = pc[1], nv = pc[2], i, j, e = .002;
        for (j = 0; j <= nv; j++) for (i = 0; i <= NU; i++){
          var u = -1 + 2 * i / NU, v = v0 + (v1 - v0) * j / nv, p = pt(u, v, sd);
          var pu = sub(pt(Math.min(1, u + e), v, sd), pt(Math.max(-1, u - e), v, sd)), pv = sub(pt(u, Math.min(1, v + e), sd), pt(u, Math.max(-1, v - e), sd)), n = norm(cross(pu, pv)), t = norm(pu);
          if (sd < 0) n = [-n[0], -n[1], -n[2]];
          V.push(p[0], p[1], p[2], n[0], n[1], n[2], t[0], t[1], t[2], (u + 1) / 2, (1 - v) / 2, pc[3] * sd);
        }
        for (j = 0; j < nv; j++) for (i = 0; i < NU; i++){
          var a = base + j * (NU + 1) + i, b = a + 1, c = a + NU + 1, d = c + 1;
          if (sd > 0) I.push(a, b, d, a, d, c); else I.push(a, d, b, a, c, d);
        }
        base += (nv + 1) * (NU + 1);
      });
    });
    return MESH = { v: new Float32Array(V), i: new Uint16Array(I) };
  }

  var VS = [
    'attribute vec3 aP,aN,aT;attribute vec2 aUV;attribute float aF;',
    'uniform mat4 uPr;uniform float uA,uTl,uCut,uDir,uFly;',
    'varying vec3 vN,vT,vV;varying vec2 vUV;varying float vS,vAl,vCm;',
    'vec3 ry(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x*c+p.z*s,p.y,-p.x*s+p.z*c);}',
    'vec3 rx(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x,p.y*c-p.z*s,p.y*s+p.z*c);}',
    'vec3 rz(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x*c-p.y*s,p.x*s+p.y*c,p.z);}',
    'void main(){',
    '  vec3 p=aP,n=aN,t=aT;float al=1.0,sd=sign(aF);',
    '  float s=(p.x/100.0*uDir+1.0)*.5;',                                                 // 0 = 자르기 시작한 쪽
    '  float cm=smoothstep(0.0,.06,uCut-s);',
    '  if(abs(aF)>1.5){',                                                                  // 윗띠: 잘린 만큼 보는 사람 쪽으로 말려 올라간다
    '    float d=max(0.0,uCut-s)*200.0;',
    '    if(d>0.0){',
    '      float k=.0056,ph=min(d*k,1.2),rem=d-ph/k;',
    '      float xr=sin(ph)/k+rem*cos(ph),zr=(1.0-cos(ph))/k+rem*sin(ph);',
    '      p.x=(uCut*2.0-1.0)*100.0*uDir-uDir*xr;p.z+=zr;p.y+=xr*.07+zr*.2;',
    '      n=ry(n,uDir*ph);t=ry(t,uDir*ph);',
    '    }',
    '    if(uFly>0.0){',                                                                   // 다 잘린 띠가 날아간다
    '      vec3 c=vec3(0.0,127.0,40.0);float f=uFly;',
    '      p=c+rz(rx(p-c,-f*1.7),-uDir*f*1.0);n=rz(rx(n,-f*1.7),-uDir*f*1.0);t=rz(rx(t,-f*1.7),-uDir*f*1.0);',
    '      p+=vec3(-uDir*50.0*f,34.0*f+130.0*f*f,60.0*f);',
    '      al=1.0-smoothstep(.5,1.0,f);',
    '    }',
    '  }else{',                                                                            // 입구가 살짝 벌어진다(자른 선 바로 아래만)
    '    float m=cm*(1.0-smoothstep(0.0,56.0,108.04-p.y))*sin(clamp(s,0.0,1.0)*3.14159);',
    '    p.z+=sd*8.0*m;',
    '  }',
    '  p=rx(ry(p,uA),uTl);n=rx(ry(n,uA),uTl);t=rx(ry(t,uA),uTl);',
    '  vN=n;vT=t;vV=vec3(-p.x,-p.y,' + CAM + '.0-p.z);vUV=aUV;vS=sd;vAl=al;vCm=cm;',
    '  gl_Position=uPr*vec4(p.x,p.y,p.z-' + CAM + '.0,1.0);',
    '}'].join('\n');
  var FS = [
    '#ifdef GL_FRAGMENT_PRECISION_HIGH',
    'precision highp float;',
    '#else',
    'precision mediump float;',
    '#endif',
    'uniform sampler2D uTex;uniform vec3 uTint,uGlow;uniform float uGa;',
    'varying vec3 vN,vT,vV;varying vec2 vUV;varying float vS,vAl,vCm;',
    'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
    'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y);}',
    'float hgt(vec2 q){return noise(vec2(q.x*6.0,q.y*3.4))*.6+noise(vec2(q.x*13.0+7.1,q.y*5.2+2.3))*.3+noise(vec2(q.x*27.0+3.3,q.y*9.0))*.12;}',
    'vec3 hsv(float h){return clamp(abs(mod(h*6.0+vec3(0.0,4.0,2.0),6.0)-3.0)-1.0,0.0,1.0);}',
    'float env(vec3 r){',                                                                  // 스튜디오 조명 흉내: 위가 밝고, 오른쪽 앞에 큰 조명 · 왼쪽에 보조 · 뒤쪽 테두리 조명 둘
    '  float y=r.y*.5+.5,a=atan(r.x,r.z);',
    '  float e=mix(.3,.8,smoothstep(0.0,1.0,y));',
    '  e+=1.25*exp(-pow((a-.5)/.24,2.0))*smoothstep(-.6,.2,r.y);',
    '  e+=.65*exp(-pow((a+.95)/.32,2.0))*smoothstep(-.7,.1,r.y);',
    '  e+=.5*exp(-pow((a-2.7)/.3,2.0))+.5*exp(-pow((a+2.6)/.3,2.0));',
    '  e+=.35*smoothstep(.74,.98,y);',
    '  return e;',
    '}',
    'void main(){',
    '  float ty=vUV.y,zig=abs(fract(vUV.x*24.0)-.5)*2.0;',
    '  if(ty<.011*zig||ty>1.0-.011*zig)discard;',                                           // 위아래 끝은 톱니
    '  bool ins=!gl_FrontFacing;',
    '  vec3 n=normalize(vN),t=normalize(vT),V=normalize(vV);',
    '  if(ins)n=-n;',
    '  vec3 b=cross(n,t);',
    '  float body=smoothstep(.13,.19,ty)*(1.0-smoothstep(.87,.93,ty));',
    '  float ns=1.0-smoothstep(0.0,.2,min(abs(ty-.13),abs(ty-.93)));',
    '  vec2 q=vec2(vUV.x+vS*3.7,ty);float e=.004,h0=hgt(q);',
    '  n=normalize(n-(t*(hgt(q+vec2(e,0.0))-h0)+b*(hgt(q+vec2(0.0,e))-h0))/e*(.012+.03*ns)*body);',
    '  n=normalize(n+t*sin(vUV.x*214.0)*.2*(1.0-body));',                                  // 봉한 띠의 잔 세로 주름
    '  vec3 r=reflect(-V,n);float E=env(r);',
    '  vec3 col=mix(uTint,vec3(1.0),.12)*E+vec3(1.0)*pow(max(E-1.2,0.0),1.5)*.55;',
    '  float ir=dot(n,V);vec3 rb=hsv(fract(ir*1.3+r.x*.55+r.y*.4+ty*.35));',              // 홀로그램: 보는 각에 따라 무지개가 지나간다
    '  float band=exp(-pow((r.x*.9+r.y*.55-.12)/.2,2.0));',
    '  float hm=.3+.7*body;col=mix(col,col*(rb*1.4+.3),.4*hm*smoothstep(.6,1.5,E))+rb*band*.26*hm;',
    '  vec4 ink=texture2D(uTex,vec2(vS>0.0?vUV.x*.5:1.0-vUV.x*.5,ty));',                   // 인쇄: 왼쪽 절반 = 앞면 · 오른쪽 절반 = 뒷면(뒤에서 봐도 글자가 바로 보이게 뒤집어 읽음)
    '  float dif=.55+.45*max(dot(n,normalize(vec3(.3,.5,.8))),0.0);',
    '  col=mix(col,ink.rgb*dif+E*.05,ink.a);',
    '  col*=mix(.8,1.0,smoothstep(0.0,.09,min(abs(ty-.13),abs(ty-.93)))*body+(1.0-body));',   // 볼록한 몸통이 봉한 띠로 꺾여 들어가는 곳은 어둡게
    '  if(ins){col=vec3(.8,.82,.88)*(E*.6+.2);col=mix(col,uGlow,uGa*.75);}',              // 안쪽 면: 은빛 + 틈새 빛
    '  else col+=uGlow*uGa*vCm*(1.0-smoothstep(0.0,.07,abs(ty-.13)))*.55;',
    '  gl_FragColor=vec4(col*vAl,vAl);',
    '}'].join('\n');

  // 인쇄 그림(앞 512 + 뒤 512 = 1024 × 748): 글자 색 · 불투명도가 그대로 잉크가 된다(투명한 곳 = 박이 그대로 보임)
  function art(o){
    var c = document.createElement('canvas'), g = c.getContext('2d'), TW = 512, TH = 748, MONO = '"JetBrains Mono",ui-monospace,monospace', SANS = '"Pretendard Variable","Noto Sans KR",sans-serif';
    c.width = TW * 2; c.height = TH;
    function rr(x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
    function sp(px){ try { g.letterSpacing = px + 'px'; } catch (e){} }
    [0, TW].forEach(function(x0){                                                         // 자르는 선(점선) — 앞 · 뒤 모두
      g.save(); g.setLineDash([11, 8]); g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2.4; g.beginPath(); g.moveTo(x0 + 12, TH * .13); g.lineTo(x0 + TW - 12, TH * .13); g.stroke(); g.restore();
    });
    g.textAlign = 'center'; g.textBaseline = 'middle';
    var top = TH * .13, bot = TH * .93, py = top + (bot - top) * .17, ph = (bot - top) * .66;
