<script>!function(e){var r={meta:{id:"bread",title:"빵찾아 삼만리",tab:"bread",master:"bread-check",global:"SGBREAD",dataGlobal:"SGBREAD_DATA",ver:3,files:{data:"tools/bread-data.js",engine:"tools/bread-engine.js",screen:"tools/bread.js",master:"tools/bread-master.js"},img:"img/bread/",icon:"#i-bread",compare:'판정은 늘 "합이 목표 이상(≥)". 예외는 알바와 맞짱(알바 합보다 "크게" — 같으면 무승부 다시) 하나. 가격 맞히기만 위 끝(이하)이 더 붙는다.',screenGlobal:"SGBREADV",screenApi:"window.SGBREADV = { mount(el, opt), demo(el, preset) } — 게임 화면과 마스터 미리보기가 같은 함수로 그린다",terms:'"게임(한 판)" = 1일차 집에서 나와 3일차 405번지까지(또는 체력이 다할 때까지) 한 번. "하루(N일차)" = 보드 한 바퀴(집 → 매장 1~31 → 집) — 한 판은 3일(3바퀴). "라운드" = 듀얼에서 기회 k번을 굴리는 한 묶음(지연 2라운드 · 405번지 시험 단계 · 재도전 모두 라운드). "기회" = 라운드 안의 굴림 한 번. 가위바위보만 "3판 2선승"처럼 판을 쓴다',v3:"9/28 사용자 수정 요청 — 3일(3바퀴) · 요소 칸 배치(각 3칸) · 황금 카드(응원봉) · 2.5D 보드(화면). 바뀐 것만 worklog/bread/spec-v3.md, 나머지는 spec.md(v2)"},texts:{title:"빵찾아 삼만리",sub:'31곳의 CU를 사흘 동안, 단 하나의 질문 — "리센느 빵 있어요?"',intro:"405빵이 풀렸다는 소식! 그런데 동네 CU 는 전부 품절… 이대로 포기할 순 없다. 리마인의 사흘간의 빵 원정이 시작된다.",howto:['한 번에 한 칸씩, 매장마다 알바에게 "리센느 빵 있어요?" — 하루에 31곳, 사흘 동안 세 바퀴',"주사위 2개의 합이 목표 이상이면 빵 획득 — 빵 하나에 포토카드 한 장. 아깝게 졌다면 황금 카드(↓)로 주사위 하나를 다시!","보드 위 요소 칸(물류 센터 · 빵 공장 · 배달 기사 · 리마인 단톡방)에 서면 사건이, 황금 카드 칸에 서면 황금 카드 한 장. 배치는 날마다 바뀐다","기회를 다 쓰면 체력 ♥ −1, 같은 매장에 다시 도전(질수록 조금씩 쉬워짐). ♥ 가 다 떨어지면 끝 — 밤에 집에서 자면 ♥ 회복","3일차 405번지의 마지막 시험까지 넘으면 완주! 점수 = 통과한 매장 + 포토카드"],btn:{daily:"오늘의 코스",random:"랜덤 코스",resume:"이어 하기",move:"한 칸 가기",ask:"리센느 빵 있어요?",roll:"주사위 굴리기",keep:"그대로(실패)",retry:"다시 조르기(자동)",next:"빵 봉투 열기(자동)",again:"다시 원정 가기",ride:"오토바이 타기",walk:"괜찮아요, 걸어갈게요",stick:"황금 카드 쓰기",more:"하나 더요?",skipMore:"다음 칸",sameCourse:"같은 사건, 새 주사위",dealYes:"좋아요, 그걸로!",dealNo:"그냥 주세요",rollAll:"전부 굴리기",pickDie:"이 주사위 다시",cancel:"취소",exit:"나가기"},hud:{heart:"체력",cards:"포카 {n}장 · {k}종",pass:"통과 {n}/93",code:"코스 {course}",stick:"황금 카드 {n}",left:"405번지까지 {n}곳",day:"{d}일차",clock:"{d}일차 · {clock} · {no}/31"},sys:{heartLost:"체력 ♥ −1",pity:"단골 보정 — 한 단계 쉬워졌어요",delay2:"빵 전달 지연! 한 라운드 더 이겨야 빵이 도착한다.",delay1ok:"1라운드 통과! 트럭이 오고 있다… 한 라운드 더!",bossWin:"비밀 창고 개방! 하나 고르세요",newCard:"NEW! 처음 모은 카드",dupCard:"중복 ×{n}",errorTwo:"공장 오류… 인데 2장?! 이득!",errorZero:"공장 오류… 봉투가 텅 비었다.",ride:"오토바이로 매장을 지나쳤다. 빵은… 다음에.",corner:"{side} 에 들어섰다!",final:"마지막 매장. 405번지.",gameOver:"발바닥에 물집이 잡혔다… 오늘의 빵 원정은 여기까지.",clear:"3일차 405번지의 마지막 빵을 손에 넣었다! 빵찾아 삼만리, 사흘 완주!",near:"아깝다!",lastTry:"마지막 기회!",phase:"{n}번째 시험 통과! (체크포인트)",setDone:"{member} 세트 완성!",moreWin:"하나 더 받았다!",moreLose:"욕심은 금물… 방금 받은 카드를 돌려드렸다.",practice:"연습 판 — 오늘의 코스 기록은 그날 첫 판만 남아요",crisis:"체력 1… 조심조심!",dealIn:"알바가 슬쩍 제안한다",tipNew:"처음 보는 규칙!",sg405Off:"포토카드 목록이 바뀌어 게임을 잠시 쉬어요. 곧 고칠게요!",moreWin34:"대박! 떨이 빵 세 개!",dayEnd:"{d}일차 끝! 집으로…",night:"하룻밤 푹 자고 체력 ♥ +{n}",nightFull:"하룻밤 푹 잤다(체력은 이미 가득)",dayStart:"{d}일차 아침 — 오늘의 배치!",gold:"황금 카드 +1!",goldFull:"황금 카드가 가득(3장)! 대신 포토카드 +1",stage:"오늘의 시험 — {n}단계"},tips:{"g:none":"두 주사위 합이 목표 이상이면 통과.","g:plus1":"더블(두 눈이 같음)이면 목표와 상관없이 통과 — 빵도 하나 더(매장당 1번)!","g:reroll":"실패하면 ↓ 로 주사위 하나를 공짜로 다시 굴릴 수 있어요(라운드에 1번).","g:vs":"알바도 굴려요. 내 합이 알바보다 크면 통과, 같으면 기회를 안 쓰고 다시.","g:stack":"굴린 합이 계속 쌓여요. 누적이 목표에 닿는 순간 통과.","g:no1":"눈 1이 하나라도 나오면 그 굴림은 무효예요.","g:parity":"정해진 홀수 · 짝수 합만 인정돼요.","g:range":"너무 높아도 실패! 범위 안에 들어야 통과.","g:blind":"목표는 굴린 뒤에 공개돼요(목표 ±1).","g:rising":"굴릴 때마다 목표가 1씩 올라가요 — 첫 굴림이 제일 쉬워요.","g:falling":"굴릴 때마다 목표가 1씩 내려가요 — 버티면 이겨요.","g:triple":"주사위 3개 중 큰 두 개의 합으로 판정해요.","g:final":"405번지 시험 — 1일차 ① · 2일차 ①② · 3일차 ①②③. 그날 깬 시험은 남아요(체크포인트).",stick:"황금 카드(응원봉): 실패한 굴림 직후 ↓ → 주사위 하나를 골라 다시 굴려요(기회 안 씀). 최대 3장.",pity:"단골 보정: 같은 매장에서 질 때마다 한 단계 쉬워져요(최대 2).",crisis:"체력이 1이에요! 앞으로 올 빵 공장 · 단톡방 칸이나 보스 창고에서 회복할 수도 있어요.",more:"하나 더요: 성공하면 카드 추가, 실패하면 방금 받은 카드를 돌려줘요.",more34:"3 · 4장의 하나 더요는 대박 찬스(+3)! 걸린 카드가 NEW 라면 참는 것도 방법.",deal:"알바의 제안: ↑ 로 받거나, Space 로 그냥 물어봐요.",pick:"비밀 창고: ♥ · 응원봉 · 빵 중 하나를 골라요.",ride:"진짜 기사님: 타면 듀얼 없이 통과하지만 빵은 없어요.",delay:"빵 전달 지연: 2라운드를 이겨야 빵이 와요. 이긴 라운드는 남아요.",rps:"힌트 한 줄을 잘 읽어 보세요 — 쌩쌩이는 버릇이 있어요.",chase:"화살표 순서대로! 빨간(속이 빈 ↺) 화살표는 반대 방향이에요.",gold:"황금 카드 칸: 도착하면 황금 카드 1장! 이미 3장이면 포토카드 +1 로 바뀌어요.",land:"요소 칸: 그날 배치가 보드 위에 미리 보여요. 도착하면 그 요소의 사건 하나가 일어나요.",night:"하루 끝: 집에서 하룻밤 자면 체력 ♥ 회복. 다음 날 아침엔 요소 칸 배치가 새로 바뀌어요.",again:"2 · 3일차: 알바들이 나를 기억해요. 대신 매장 기준이 날마다 조금씩 깐깐해져요.",test:"405번지 시험은 날마다 한 단계씩 늘어요 — 1일차 ① · 2일차 ①② · 3일차 ①②③."},tipsRule:'규칙 · 기믹 · 아이템을 처음 만날 때 한 번만, 대사창 위에 한 줄(1.8초 또는 Space). 본 것은 sg:bread-opt.seen 에 기억. 설정 "도움말"을 켜면 다시 보임. v3 새 도움말: gold(황금 카드 칸) · land(요소 칸) · night(하루 끝) · again(2 · 3일차) · test(405번지 시험 단계)',quiet:["조용한 거리… 아무 일도 없었다.","바람이 분다. 빵 냄새는 아직 멀다.","센둥이 레이더 반응 없음. 그냥 걷는다.","신호등이 한 번에 초록불! …그게 다였다.","편의점 불빛이 보인다. 이번엔 있겠지?","휴대폰 배터리 42%… 아직 괜찮아.","이어폰에서 리센느 노래가 나온다.","발바닥이 살짝 아파 온다.","길고양이가 빵 봉투를 빤히 본다. 미안, 이건 안 돼.","단톡방 알림이 잠잠하다. 폭풍 전의 고요?","교통카드를 찍었다. 잔액은… 보지 않기로 했다.","편의점 앞 벤치에서 잠깐 숨 돌리기. 다음 매장으로!"]},player:{ask:"리센느 빵 있어요?",name:"나",lines:{first:"리센느 빵 있어요?",retry:"저… 리센느 빵… 아직 있죠?",boss:"리센느 빵, 여기 있다고 들었습니다.",delay:"한 번만 더 확인해 주세요!",final:"리센느 빵… 마지막 한 개, 여기 있죠?",again:"저 또 왔어요! 리센느 빵, 오늘은 있어요?",test:"405번지… 오늘의 시험, 보러 왔습니다!"},note:"first = 1일차 매장 · again = 2 · 3일차 매장 · boss = 보스(8 · 16 · 24) · test = 405번지 1 · 2일차 · final = 405번지 3일차 · retry · delay"},board:{size:9,cells:32,stores:31,dir:"cw",start:{no:0,n:"리마인 자취방",d:"405빵 원정의 출발점. 신발 끈 꽉 묶고, 교통카드 충전 완료.",grid:{r:8,c:8},sprite:"tile_home"},coord:"칸 i → (행, 열), 0부터: i 0~8 → (8, 8−i) · 9~16 → (16−i, 0) · 17~24 → (0, i−16) · 25~31 → (i−24, 8). 0 = 오른쪽 아래 출발, 아래 줄을 왼쪽으로 → 왼쪽 열을 위로 → 위 줄을 오른쪽으로 → 오른쪽 열을 아래로(모두의 마블 · 시계 방향)",corners:[8,16,24],bosses:[8,16,24,31],final:31,center:{logi:{r:1,c:1,w:2,h:2},fac:{r:1,c:6,w:2,h:2},chat:{r:6,c:6,w:2,h:2},rider:{r:6,c:1,w:2,h:2},banner:{r:1,c:3,w:3,h:1},dice:{r:3,c:2,w:5,h:3},status:{r:7,c:3,w:3,h:1},duel:{r:1,c:1,w:7,h:7,note:"듀얼 · 미니게임 · 카드 공개 창은 가운데 7×7 전체를 덮는다"},note:"좌표는 9×9 격자 기준(0부터) — 가운데 7×7 은 r · c 1~7"},roulette:["logi","fac","chat","rider"]},acts:[{act:1,n:"우리 동네 한 바퀴",from:1,to:8,boss:8,banner:'"동네 CU 에는 있겠지?" …라고 생각했던 시절.',palette:"새벽 → 아침 (남보라 · 연분홍)",bgm:1,clock:"새벽"},{act:2,n:"서울 빵지순례",from:9,to:16,boss:16,banner:"핫플마다 빵은 없고 줄만 있다. 그래도 간다.",palette:"한낮 (하늘색 · 민트)",bgm:1.05,clock:"한낮"},{act:3,n:"전국 원정대",from:17,to:24,boss:24,banner:"교통비가 빵값을 넘은 지 오래. 여기까지 온 이상 멈출 수 없다.",palette:"오후 → 노을 (노랑 · 주황)",bgm:1.1,clock:"노을"},{act:4,n:"삼만리의 끝",from:25,to:31,boss:31,banner:"돌아온 서울, 마지막 한 개가 남아 있다는 소문.",palette:"밤 (남색 · 간판 네온)",bgm:1.2,countdownFrom:28,clock:"밤"}],tiles:[{no:1,n:"CU 우리집앞점",act:1,clerk:"rookie",gimmick:"none",target:4,tries:2,bread:1,p1:.993,lines:{ask:'어, 어서 오세요! 리센느 빵이요? 잠시만요, 매뉴얼에… "주사위 두 개 합이 4 이상이면 드릴 것"? 이런 게 왜 매뉴얼에 있죠?',win:"합격이에요! 첫 손님한테 빵 팔았다… 저 오늘 칭찬받겠다!",lose:"아앗, 합이 모자라셨어요… 봐 드리고 싶은데 매뉴얼대로 해야 해서요!"},grid:{r:8,c:7},sprite:"tile_store"},{no:2,n:"CU 빵빵사거리점",act:1,clerk:"dawn",gimmick:"plus1",target:5,tries:2,bread:1,p1:.988,lines:{ask:"(하품) 리센느 빵… 있긴 있어요오… 5 이상이면 드릴게요오… 아, 더블 나오면 1+1 행사 중이에요오…",win:"축하드려요오… 저는 다시 새벽 입고 정리하러 가요오…",lose:"빵빵거리는 경적 소리에 저만 깼네요오… 이번엔 안 돼요오…"},grid:{r:8,c:6},sprite:"tile_store"},{no:3,n:"CU 소보로초교점",act:1,clerk:"chung",gimmick:"reroll",target:5,tries:2,bread:1,p1:.993,lines:{ask:"아이구, 학교 앞이라 애들이 싹 다 쓸어 갔는디… 딱 하나 남았슈. 5 이상이면 줄게유~ 맘에 안 들면 주사위 하나는 다시 굴려도 되고유~",win:"잘혔네, 잘혔어~ 소보로 가루 흘리지 말고 조심히 가유~",lose:"아이구 아깝다~ 그려도 우리 가게 인심은 안 박해유. 다시 해 봐유~"},grid:{r:8,c:5},sprite:"tile_store"},{no:4,n:"CU 단팥아파트점",act:1,clerk:"cool",gimmick:"none",target:5,tries:2,bread:1,p1:.972,lines:{ask:"ㅇㅇ 있어요. 5 이상, 두 번이요.",win:"ㅊㅋ드려요. 영수증 드릴까요?",lose:"ㄴㄴ… 다음 분 받을게요."},grid:{r:8,c:4},sprite:"tile_store"},{no:5,n:"CU 식빵역 2번출구점",act:1,clerk:"weekend",gimmick:"falling",target:7,tries:2,bread:1,p1:.884,lines:{ask:"출근길 러시 끝나고 딱 하나 남았어요. 7부터 시작인데, 마감 세일이라 굴릴 때마다 기준이 1씩 내려가요. 교수님 채점보다 너그럽죠?",win:"축하해요. 저는 이 기세로 레포트 쓰러… 아, 근무 중이지…",lose:"출구 잘못 나오신 표정이시네요. 한 바퀴 돌고 다시 오세요."},grid:{r:8,c:3},sprite:"tile_store"},{no:6,n:"CU 모닝빵공원점",act:1,clerk:"dawn",gimmick:"parity",target:2,tries:4,gp:{par:"even"},bread:1,p1:.938,lines:{ask:"아침 산책 나오셨어요오…? 오늘은 '짝수 행사'래요오… 짝수만 나오면 드려요오… 홀수는 다음 행사 때요오…",win:"모닝빵처럼 상쾌한 승리네요오… 저는 퇴근이 세 시간 남았어요오…",lose:"공원 한 바퀴 돌고 오세요오… 저는 여기 계속 있어요오… 계속…"},grid:{r:8,c:2},sprite:"tile_store"},{no:7,n:"CU 버터롤대학로점",act:1,clerk:"weekend",gimmick:"blind",target:6,tries:3,bread:1,p1:.976,lines:{ask:"시험 기간이라 빵이 모자라요. 기준은… 비밀! 굴리고 나면 알려 드릴게요. 저도 시험 범위 모르고 공부하거든요.",win:"와, 찍었는데 맞히셨네요? 제 기말고사도 그렇게 되길…",lose:"아깝다! 오픈북이 아니었어요. 다음 시험… 아니 다음 라운드엔 꼭!"},grid:{r:8,c:1},sprite:"tile_store"},{no:8,n:"CU 동네터줏대감점",act:1,clerk:"manager",gimmick:"reroll",target:8,tries:2,boss:!0,bread:1,p1:.845,lines:{ask:"이 동네 빵은 30년째 제가 지켜 왔습니다. 리센느 빵이라… 8 이상. 한 번은 주사위를 다시 굴릴 기회를 드리죠. 동네를 떠날 자격이 있는지 보겠습니다.",win:"…합격입니다. 이제 동네 밖으로 나가셔도 되겠군요. 이건 제 비밀 창고에서 꺼낸 겁니다.",lose:"아직 동네 밖은 이릅니다. 호흡을 가다듬고 다시 오세요."},grid:{r:8,c:0},sprite:"tile_boss"},{no:9,n:"CU 망원빵원점",act:2,clerk:"fan",gimmick:"plus1",target:7,tries:2,bread:1,p1:.889,lines:{ask:"리, 리센느 빵이요?! (흠칫) …혹시 최애가 누구세요? 아, 아니에요. 7 이상이면 드릴게요. 더블이면 1+1 행사까지! (같은 리마인이라 제가 다 떨리네요…)",win:"(울먹) 소원 빌듯이 굴리시더니… 가져가세요. 대신 인증 사진 꼭 올려 주세요!",lose:"아앗, 아쉬워요! 진짜로요! 같은 리마인이라 봐 드리고 싶은데 규칙은 규칙이라… 다음엔 꼭!"},grid:{r:7,c:0},sprite:"tile_store"},{no:10,n:"CU 연남빵트럴파크점",act:2,clerk:"cool",gimmick:"none",target:7,tries:3,bread:1,p1:.928,lines:{ask:"빵 찾으러 오신 분 오늘 백 번째예요. 7 이상, 세 번이요.",win:"ㅇㅋ 됐어요. 피크닉 ㄱㄱ하세요.",lose:"ㄴㄴ… 잔디밭에서 좀 쉬다 오세요."},grid:{r:6,c:0},sprite:"tile_store"},{no:11,n:"CU 홍대빵구점",act:2,clerk:"weekend",gimmick:"vs",target:0,tries:3,gp:{b:-1},bread:1,p1:.947,lines:{ask:"홍대는 버스킹의 도시죠. 저랑 주사위 맞대결 어때요? 버스킹 행사라 제 합에서 1 빼 드릴게요. 그보다 높으면 드려요. 비기면 다시!",win:"와, 앵콜 받으실 실력인데요? 빵 받으세요!",lose:"제가 이겼네요! 앵콜 무대는 다음 라운드에 보여 주세요~"},grid:{r:5,c:0},sprite:"tile_store"},{no:12,n:"CU 성수빵지순례점",act:2,clerk:"vet",gimmick:"stack",target:17,tries:3,bread:1,p1:.855,lines:{ask:"성수는 웨이팅의 성지죠. 세 번 굴려서 합이 17 쌓이면 드립니다. 여기 줄 선 분들 다 그렇게 받아 갔어요.",win:"웨이팅 성공. 성수에서 이 정도 기다리셨으면 양반입니다.",lose:"적립이 조금 모자라네요. 줄은 다시 서셔야 합니다."},grid:{r:4,c:0},sprite:"tile_store"},{no:13,n:"CU 을지로4빵가점",act:2,clerk:"dawn",gimmick:"no1",target:6,tries:3,bread:1,p1:.941,lines:{ask:"을지로 감성이라 빵도 레트로예요오… 6 이상인데요오… 1이 나오면 유통기한 지난 걸로 쳐요오… 본사 검수 기준이래요오…",win:"힙하시네요오… 필름 카메라로 인증하시면 더 힙해요오…",lose:"오늘은 을지로 감성이 안 도와주네요오… 골목 한 바퀴 돌고 오세요오…"},grid:{r:3,c:0},sprite:"tile_store"},{no:14,n:"CU 버터리단길점",act:2,clerk:"rookie",gimmick:"range",target:5,tries:3,gp:{w:3},bread:1,p1:.912,lines:{ask:'지금 "빵 가격 맞히기" 이벤트 중이에요! 합이 5부터 8 사이면 정답! 너무 높아도 안 돼요… 이 이벤트 제가 만든 거 아니에요!',win:"정답! 딩동댕~ 저 딩동댕 처음 해 봐요!",lose:"땡…! 아, 땡 하는 거 너무 미안하다…"},grid:{r:2,c:0},sprite:"tile_store"},{no:15,n:"CU 여의도빵꽃축제점",act:2,clerk:"chung",gimmick:"falling",target:8,tries:3,bread:1,p1:.932,lines:{ask:"꽃구경 왔슈? 축제라 빵이 금방 나가유. 8부터 시작인디, 한 번 굴릴 때마다 1씩 깎아 줄게유~ 떨이유 떨이~",win:"꽃보다 빵이쥬~ 잘 가유~",lose:"아이구, 꽃잎만 날리고 빵은 못 날렸네~ 한 번 더 해 봐유~"},grid:{r:1,c:0},sprite:"tile_store"},{no:16,n:"CU 강남빵역점",act:2,clerk:"manager",gimmick:"triple",target:9,tries:2,boss:!0,bread:1,p1:.773,lines:{ask:"서울의 모든 빵 소문은 이 교차로를 지나갑니다. 주사위 세 개를 드리죠. 큰 두 개의 합이 9 이상이면, 서울을 떠나도 좋습니다.",win:"강남에서 살아남으셨군요. 이제 전국으로 가십시오. 비밀 창고의 빵도 챙겨 가시고요.",lose:"강남은 만만한 곳이 아닙니다. 퇴근 시간 지나서 다시 오세요."},grid:{r:0,c:0},sprite:"tile_boss"},{no:17,n:"CU 춘천닭갈빵점",act:3,clerk:"chung",gimmick:"plus1",target:8,tries:3,bread:1,p1:.875,lines:{ask:"서울서 여까지 빵 찾으러 왔슈? 닭갈비는 안 먹고? 8 이상이면 줘유. 더블이면 하나 더 얹어 줄게유~",win:"잘 가유~ 닭갈비도 꼭 먹고 가유, 빵만 먹지 말고~",lose:"아이구, 호숫가 바람이 차지유? 한 번만 더 해 봐유~"},grid:{r:0,c:1},sprite:"tile_store"},{no:18,n:"CU 강릉커피빵거리점",act:3,clerk:"dawn",gimmick:"reroll",target:8,tries:3,bread:1,p1:.917,lines:{ask:"커피 한 잔 마셨더니 완전 깼어요!!! 8 이상!!! 주사위 하나는 한 번 다시 굴려도 돼요!!!",win:"축하해요!!! 강릉 바다처럼 시원한 승리!!!",lose:"아쉬워요!!! 파도처럼 다시 밀려오세요!!!"},grid:{r:0,c:2},sprite:"tile_store"},{no:19,n:"CU 대전빵의성지점",act:3,clerk:"vet",gimmick:"stack",target:23,tries:4,bread:1,p1:.87,lines:{ask:"여기가 빵의 도시인 거 아시죠? 이 동네 분들 빵에 진심입니다. 네 번 굴려서 23 채우시면 인정해 드리죠.",win:"빵의 도시가 당신을 인정합니다. 이 도시에서도 귀한 빵이에요.",lose:"빵의 도시는 호락호락하지 않습니다. 한 바퀴 돌고 오세요."},grid:{r:0,c:3},sprite:"tile_store"},{no:20,n:"CU 전주비빔빵마을점",act:3,clerk:"rookie",gimmick:"parity",target:5,tries:4,gp:{par:"odd"},bread:1,p1:.905,lines:{ask:"한옥마을 지점 첫 근무예요! 홀수로 5 이상 나오면 드리래요. 왜 홀수냐고요? 저도 몰라요! 매뉴얼에 그렇게…!",win:"고명처럼 딱 맞게 나왔어요! 맛있게 비벼… 아니 드세요!",lose:"짝수가 나와 버렸… 아, 기회 끝이네요! 기와처럼 차분하게 다시 해 봐요!"},grid:{r:0,c:4},sprite:"tile_store"},{no:21,n:"CU 경주빵리단길점",act:3,clerk:"vet",gimmick:"blind",target:7,tries:3,bread:1,p1:.923,lines:{ask:"천년 고도에선 기준도 비밀입니다. 굴리고 나면 공개해 드리죠. 대충 7 언저리라고만 해 두겠습니다.",win:"첨성대에서 별을 읽듯 맞히셨군요. 가져가세요.",lose:"천 년을 기다린 빵입니다. 조금 더 기다리셔도 괜찮아요."},grid:{r:0,c:5},sprite:"tile_store"},{no:22,n:"CU 여수밤빵바다점",act:3,clerk:"fan",gimmick:"no1",target:7,tries:3,bread:1,p1:.895,lines:{ask:"밤바다 보면서 리센느 노래 듣고 있었는데… 아, 빵이요? (정신 차림) 7 이상, 1이 나오면 무효예요. 감성 깨지 말아 주세요…",win:"밤바다처럼 반짝이는 승리… 가져가세요. 저는 다시 감성 모드로…",lose:"아, 아쉬워요! 바다 한번 보고 마음 가라앉히고 오세요. 저 여기서 응원할게요."},grid:{r:0,c:6},sprite:"tile_store"},{no:23,n:"CU 부산빵운대점",act:3,clerk:"cool",gimmick:"vs",target:0,tries:3,gp:{b:-1},bread:1,p1:.947,lines:{ask:"ㅇㅇ 부산까지 오셨어요? ㄷㄷ 저랑 맞짱이요. 오늘 행사라 제 합 −1, 그거 넘으시면 드려요.",win:"ㅇㅈ합니다. 바다 보고 가세요.",lose:"ㅋ 제가 이겼네요. 파도 좀 타다 오세요."},grid:{r:0,c:7},sprite:"tile_store"},{no:24,n:"CU 제주감귤빵섬점",act:3,clerk:"manager",gimmick:"vs",target:0,tries:3,gp:{b:1},boss:!0,bread:1,p1:.757,lines:{ask:"바다 건너 여기까지 오셨군요. 섬의 빵은 섬의 법을 따릅니다. 저와 겨루시죠. 제 합에 1을 더한 것보다 높아야 합니다.",win:"…육지 손님에게 진 건 처음입니다. 이제 돌아가세요. 마지막 매장이 기다립니다.",lose:"감귤이 익기를 기다리듯, 천천히 다시 오세요."},grid:{r:0,c:8},sprite:"tile_boss"},{no:25,n:"CU 김포빵항점",act:4,clerk:"weekend",gimmick:"falling",target:8,tries:3,bread:1,p1:.932,lines:{ask:"비행기 타고 돌아오셨어요? 저 방금 기말 끝나서 기분 최고예요. 8부터 시작, 굴릴 때마다 1씩 내려 드릴게요!",win:"착륙 성공! 저도 방학 착륙 성공!",lose:"회항입니다… 다시 이륙해 보세요!"},grid:{r:1,c:8},sprite:"tile_store"},{no:26,n:"CU 고속터미빵점",act:4,clerk:"rookie",gimmick:"range",target:6,tries:3,gp:{w:2},bread:1,p1:.829,lines:{ask:"여기 빵은 딱 맞는 분께만 드린대요! 합이 6부터 8 사이! 고속버스처럼 너무 빨라도 너무 느려도 안 돼요!",win:"정시 도착이에요! 버스 기사님도 놀라실 정확도!",lose:"버스를 놓치셨어요… 괜찮아요, 다음 차 금방 와요!"},grid:{r:2,c:8},sprite:"tile_store"},{no:27,n:"CU 새벽막차정류장점",act:4,clerk:"dawn",gimmick:"none",target:8,tries:4,bread:1,p1:.884,lines:{ask:"막차 끊기셨어요오…? 첫차까지 같이 버텨요오… 8 이상, 네 번이요오…",win:"첫차보다 빠른 승리네요오… 저까지 기운이 나요오…",lose:"첫차 올 때까지 해 봐요오… 저도 여기 있어요오…"},grid:{r:3,c:8},sprite:"tile_store"},{no:28,n:"CU 광역빵스환승센터점",act:4,clerk:"cool",gimmick:"stack",target:23,tries:4,bread:1,p1:.87,lines:{ask:"환승 할인처럼 누적이에요. 네 번 굴려서 23. ㄱㄱ",win:"환승 성공 ㅊㅊ드려요.",lose:"환승 시간 초과예요. 다시 찍어 주세요."},grid:{r:4,c:8},sprite:"tile_store"},{no:29,n:"CU 리마인성지점",act:4,clerk:"fan",gimmick:"plus1",target:9,tries:3,bread:1,p1:.772,lines:{ask:"여기까지 오신 리마인이면… 인정이죠. 9 이상! 더블이면 1+1 행사로 하나 더 드릴게요. (눈물 참는 중)",win:"리마인끼리는 돕는 거죠… 인증 올리실 때 이 매장 꼭 태그해 주세요!",lose:"같은 리마인이라 봐 드리고 싶은데… 저도 규칙은 지켜야 해서요… 흑."},grid:{r:5,c:8},sprite:"tile_store"},{no:30,n:"CU 품절대란최전선점",act:4,clerk:"vet",gimmick:"rising",target:7,tries:4,bread:1,p1:.854,lines:{ask:"품절 대란 최전선입니다. 지금도 빵이 줄고 있어요. 7부터 시작, 굴릴 때마다 1씩 올라갑니다. 서두르세요.",win:"마지막 한 개를 쥐셨군요. 제가 본 손님 중 제일 빨랐습니다.",lose:"방금 한 개가 또 팔렸네요. 다시 오셔야겠습니다."},grid:{r:6,c:8},sprite:"tile_store"},{no:31,n:"CU 리센느로 405번지점",act:4,clerk:"legend",gimmick:"final",boss:!0,final:!0,phases:[{gimmick:"none",target:8,tries:3,line:"첫 번째 시험 — 기본기입니다. 두 주사위 합 8 이상, 세 번 드리죠.",p1:.802},{gimmick:"vs",target:0,tries:3,gp:{b:0},line:"두 번째 시험 — 저와 맞짱입니다. 제 합보다 크게. 비기면 다시.",p1:.875},{gimmick:"triple",target:11,tries:5,line:"마지막 시험 — 주사위 셋, 큰 두 개의 합이 11 이상. 다섯 번 드리죠.",p1:.67}],p1:.47,bread:3,lines:{ask:"…사흘째 걸어온 발걸음, 잘 알고 있습니다. 오늘은 세 번의 시험을 모두 봅니다. 마지막 빵을 걸고, 전설의 끝을 보여 주세요.",win:"…삼만리의 끝에서 빵을 쥐셨습니다. 이 빵은 당신 겁니다. 리센느에게 안부 전해 주세요.",lose:"마지막 한 걸음이 가장 무거운 법이죠. 숨 고르고 다시 오세요."},grid:{r:7,c:8},sprite:"tile_final",days:{1:{ask:"…405빵을 찾아 온 리마인이군요. 마지막 빵은 사흘에 걸쳐 세 번의 시험을 모두 넘은 분께만 드립니다. 오늘은 첫 번째 시험만 보죠.",win:"…첫 번째 시험, 통과입니다. 오늘 몫의 빵 하나를 드리죠. 내일은 두 번째 시험까지 봅니다."},2:{ask:"어제 첫 시험을 넘은 그 리마인이군요. 오늘은 두 번째 시험까지 보겠습니다. 첫 번째부터 다시.",win:"두 번째 시험까지 넘으셨군요. 오늘 몫의 빵 둘입니다. 내일, 마지막 시험에서 뵙겠습니다."}},dayRule:"31번(전설의 점장님)은 날마다 시험 단계가 늘어난다: days[d].stages(1일차 ① · 2일차 ①② · 3일차 ①②③). 첫 물어보기 대사 = 1 · 2일차 days[d].ask(문구 id final:d) · 3일차 lines.ask(ask), 통과 대사 = 1 · 2일차 days[d].win(fwin:d) · 3일차 lines.win(win). 단계 대사는 phases[n].line(phase:n) 그대로. 그날 봉투 빵 = days[d].finalBread"}],clerks:[{id:"rookie",n:"신입 알바",nick:"신입이",tag:"오늘 첫 출근",desc:"매뉴얼을 한 손에 들고 다니는 성실한 신입. 포스기 앞에서 자주 허둥대지만 누구보다 친절하다. 규칙을 설명하다 스스로 놀라는 게 특기.",tone:'존댓말 · 말 더듬음 · 느낌표 많음 · "잠시만요!"',retry:["아, 또 오셨네요! 저도 방금 매뉴얼 다시 읽었어요!","이번엔 꼭 되실 거예요! …제가 응원해도 되는 거 맞죠?","매뉴얼 뒷장에 '다시 오신 손님께 더 친절히'라고 적혀 있어요!"],miss:["앗, 아깝다…! 저도 모르게 응원했어요!","어, 어어? 방금 거 아깝… 아니 규칙대로요!","괜찮아요! 기회 아직 있어요… 있죠? (매뉴얼 확인)","으악, 제 심장이 더 떨려요!"],idle:"(매뉴얼을 넘기는 소리)",sprite:"clerk_rookie",again:["어, 어제 그 손님! 저 오늘도 출근했어요! 매뉴얼은… 오늘자 공지 확인하고 올게요!","또 오셨네요! 저 어제보다 포스기 덜 헤매요! 기준은 여기 새로 붙은 공지대로요!","앗, 단골 손님이다! 잠시만요, 오늘 매뉴얼 몇 쪽이더라…!"]},{id:"dawn",n:"새벽 알바",nick:"올빼미",tag:"밤 10시 ~ 아침 8시",desc:"새벽 근무 5년 차. 늘 졸려 보이지만 새벽 입고 시간은 정확히 꿰고 있다. 말끝이 한없이 늘어진다. (커피를 마시면 사람이 바뀐다)",tone:'존댓말 · 말끝 "~요오…" · 하품',retry:["(눈 비비며) 아까 그분… 맞으시죠오…?","새벽 공기 좋죠오… 같이 버텨요오…","이번엔 저도 눈 크게 뜨고 볼게요오…"],miss:["(하품) …땡이요오…","아깝네요오… 눈이 번쩍 떠질 뻔했어요오…","다음 거는 될 거예요오… 아마도오…","(꾸벅) …앗, 방금 뭐 나왔어요오…?"],idle:"(하아아품) …입고 목록 확인 중",sprite:"clerk_dawn",again:["(하품) 어제 그분이시죠오… 오늘도 빵 찾으러 오셨어요오…?","또 뵙네요오… 저는 아직 퇴근을 못 했어요오… 기준은 본사 공지대로요오…","(눈 비비며) 이틀 연속이면… 거의 새벽 동료예요오…"]},{id:"vet",n:"10년 차 고인물 선배",tag:"편의점의 산증인",desc:"모든 콜라보 대란을 겪어 본 베테랑. 문 열고 들어오는 발소리만 듣고 리마인인지 안다. 말이 짧고 여유롭다.",tone:"존댓말 · 짧고 담담 · 달관",retry:["근성은 인정합니다.","이 정도 끈기면 지난 대란 때도 살아남으셨겠네요.","다시 줄 서신 거, 봤습니다."],miss:["아직입니다.","그 정도로는 안 됩니다.","흔들리지 마시고, 한 번 더.","대란 때 다들 여기서 한 번씩 미끄러졌습니다."],idle:"(진열대를 1mm 맞추는 중)",sprite:"clerk_vet",again:["어제 그 발걸음이군요. 기억합니다.","다시 오실 줄 알았습니다. 오늘 기준은 본사 공지대로입니다.","대란 때도 사흘은 기본이었습니다. 시작하시죠."]},{id:"manager",n:"점장님",tag:"보스 · 모서리 매장",desc:"품절 관리의 장인. 모서리 매장(8 · 16 · 24)마다 다른 점장님이지만 하나같이 비밀 창고가 있다. 엄격하지만 인정할 줄 안다. 이기면 비밀 창고를 열어 ♥ · 응원봉 · 빵 중 하나를 고르게 해 준다.",tone:"정중한 존댓말 · 무게감 · 시험하는 말투",retry:["…다시 오셨군요. 좋습니다.","포기하지 않는 손님은 오랜만입니다. 한 번 더 보죠.","좋습니다. 이번엔 조금 너그럽게 보죠."],miss:["부족합니다.","그 눈으로는 창고 문이 안 열립니다.","조금 더 보여 주시죠.","…아깝군요. 하지만 규칙은 규칙입니다."],idle:"(재고 장부를 넘긴다)",sprite:"clerk_manager",again:["어제의 그 손님이군요. 오늘도 본사 지침대로 시험하겠습니다.","다시 오셨습니까. 비밀 창고는 오늘도 쉽게 열리지 않습니다.","…포기하지 않는 발걸음이군요. 좋습니다, 다시 보죠."]},{id:"weekend",n:"주말 알바 대학생",tag:"과제 · 시험 · 알바 삼중고",desc:"과제 마감과 시험 사이에서 알바까지 하는 대학생. 모든 걸 학교생활에 비유한다. 지쳐 있지만 손님에게는 너그럽다.",tone:"존댓말 · 자조 섞인 드립 · 학교 비유",retry:["재수강 느낌이네요. 저도 해 봐서 알아요.","괜찮아요, 저도 이번 학기 두 번째 도전이에요.","재시험은 원래 조금 쉽게 나와요. 제 경험상."],miss:["오답이요~ 부분 점수도 없어요.","아깝다! 지난 학기 C+ 받은 느낌이에요.","재시험 기회는 아직 있어요!","교수님이었으면 여기서 컷이에요. 저는 아니고요!"],idle:"(몰래 전공 책을 편다)",sprite:"clerk_weekend",again:["어제 그분! 재수강 오셨네요. 오늘 시험 범위는 공지 보고 왔어요.","또 오셨어요? 저도 오늘 과제 또 있어요. 우리 같이 힘내요.","출석 체크 완료! 오늘 기준은 조교… 아니 본사 공지대로요."]},{id:"fan",n:"숨덕 알바",tag:"알고 보니 리마인",desc:"겉으로는 평범한 알바지만 사실 누구보다 진심인 리마인. 같은 팬이라 손님을 온 마음으로 응원하지만 규칙은 칼같이 지킨다. 최애를 꼭 물어본다.",tone:"존댓말 · 흠칫 · 속마음 괄호 · 최애 질문 · 응원",retry:["솔직히 말할게요. 저도 리마인이라 계속 응원 중이에요.","(규칙만 아니면 드리고 싶은데…) 다시 해요!","최애 생각하면서 굴리면 된대요! (근거 없음)"],miss:["아, 아깝다! (진심으로)","(두 손 모음) 다음엔 꼭…!","최애 이름 부르면서 굴려 보세요!","괜찮아요, 리마인은 포기 안 하잖아요!"],idle:"(계산대 옆 리센느 달력을 흘끗 본다)",sprite:"clerk_fan",again:["(흠칫) 어제 그 리마인…! 오늘도 오셨군요. 판정은 공지대로지만 마음으로 응원할게요!","또 뵈니까 너무 반가워요! (최애 얘기는 이따가…) 오늘 기준도 공지대로 갈게요.","(두 손 모음) 오늘은 꼭 되시길…! 대신 판정은 정확하게 할게요."]},{id:"cool",n:"쿨한 알바",tag:"말보다 초성",desc:"무심한 표정에 말수가 적은 알바. 초성 섞인 짧은 존댓말로 규칙을 한 줄에 끝낸다. 그래도 이기면 은근히 인정해 준다.",tone:'존댓말 + 초성 · 한 줄 규칙 · "ㅇㅇ" "ㄴㄴ"',retry:["ㄷㄷ 또 오셨어요?","ㅇㅋ 끈기 ㅇㅈ요. 다시 ㄱㄱ","ㅇㅇ 이번엔 될 듯요."],miss:["ㄴㄴ요.","ㅇㅇ 아까웠어요.","ㄱㄱ 한 번 더요.","ㅠ 거의 됐는데요."],idle:"(무표정으로 포스기를 닦는다)",sprite:"clerk_cool",again:["ㅇ 어제 그분이시네요. ㄱㄱ요.","ㄷㄷ 또 오셨어요? 오늘 기준 공지대로요.","ㅇㅇ 기억나요. 바로 굴리시죠."]},{id:"chung",n:"충청도 사장님",tag:"동네 인심 담당",desc:"30년 동네 가게를 편의점으로 바꾼 사장님. 푸근한 충청도 말씨에 인심이 넉넉하다. 그래도 빵은 그냥은 못 준다.",tone:'충청도 말씨 "~유" "~쥬" · 푸근',retry:["아이구 또 왔슈? 그 정성이면 줘야 쓰것네~","천천히 해유, 빵은 안 도망가유~ 아마두유~","아이구, 다리 아프겄네~ 이번엔 쪼끔 봐줄게유~"],miss:["아이구~ 아깝다~","쪼끔만 더 굴려 봐유~","괜찮아유, 첫술에 배부른 거 아니쥬~","어이구, 주사위가 삐졌나 봐유~"],idle:"(라디오 트로트를 흥얼거린다)",sprite:"clerk_chung",again:["아이구, 어제 그 손님 아녀? 또 왔슈~ 오늘도 본사서 정한 대로 혀유~","왔슈? 다리는 괜찮어유? 빵은 아직 있슈~ 굴려 봐유~","또 왔네~ 정성이 뻗쳤구먼유. 천천히 해유~"]},{id:"legend",n:"전설의 점장님",tag:"405번지 · 최종 보스",desc:"405빵 마지막 재고를 지키는 전설의 점장님. 세 번의 시험을 내고, 깬 시험은 인정해 준다(체크포인트). 이기면 마지막 재고 빵 3개.",tone:"정중한 존댓말 · 짧고 묵직함",retry:["포기하지 않는군요. 이 시험부터 다시 하죠.","…삼만리를 걸어온 발이군요. 한 번 더.","좋습니다. 이 시험, 조금 너그럽게 보죠."],miss:["아직입니다.","삼만리의 끝은 쉽게 오지 않습니다.","숨을 고르시죠.","…한 걸음 모자랍니다."],idle:"(마지막 빵 봉투를 가만히 쓰다듬는다)",sprite:"clerk_legend",fallback:"clerk_manager",again:["…어제의 발걸음이 오늘도 여기까지 왔군요.","다시 뵙습니다. 오늘의 시험을 보시죠."]}],clerkRule:'까다로운 규칙은 늘 "매뉴얼 · 행사 · 본사 · 점장님 지시" 탓으로 말한다(알바 개인 취향 · 감시 · 빵을 숨기거나 챙기는 연출 금지). 실패 한 줄(miss)은 line:i:a 흐름으로 고르고 같은 줄을 연달아 쓰지 않는다. 라운드를 질 때는 그 매장의 lose 대사를 먼저 쓴다. 2 · 3일차 물어보기는 알바 유형별 재방문 대사(again — 짧게, 숫자 없이 · 규칙은 배지와 그날 칩이 알려 줌)를 line 흐름으로 고르고(같은 유형 연속 같은 줄 금지), 매장 고유 ask 는 1일차만. 405번지(전설의 점장님)는 날별 대사(tiles[31].days)를 쓰므로 legend.again 은 게임에 나오지 않는다(마스터 문구 검사용)',gimmicks:[{id:"none",n:"기본 계산",desc:"두 주사위 합이 목표 이상이면 통과.",badge:"합 {t} 이상",ease:"T − e",fix:"실패한 굴림의 주사위 하나를 다시 — 같은 목표로 판정"},{id:"plus1",n:"1+1 행사",desc:"합이 목표 이상이거나 더블(두 눈이 같음)이면 통과. 더블로 이긴 라운드가 있으면 빵 +1(매장당 1번).",badge:"{t} 이상 · 더블이면 1+1",ease:"T − e",fix:"같은 목표로 판정. 다시 굴려 더블이 되어도 통과(더블 보너스 인정)"},{id:"reroll",n:"다시 찍어 드릴게요",desc:"한 라운드에 한 번 공짜로, 실패한 굴림 직후 ↓ 로 주사위 하나를 골라 다시 굴린다(기회 안 씀). 응원봉과 같은 화면.",badge:"{t} 이상 · 다시 굴리기 1회",ease:"T − e",fix:"공짜 1회가 먼저, 그다음 응원봉"},{id:"vs",n:"알바와 맞짱",desc:"알바도 주사위 2개(+보정 b)를 굴린다. 내 합이 알바 합보다 크면 통과, 같으면 무승부 — 기회를 쓰지 않고 둘 다 다시.",badge:"알바보다 크게{b}",ease:"b − e (−3 ~ +3)",note:'"이상"이 아닌 유일한 판정 — 배지 자리에 알바 주사위',fix:"내 주사위 하나만 다시(알바 주사위는 그대로). 다시 굴려 알바와 같아지면 무승부 — 기회를 쓰지 않고 둘 다 새로 굴림"},{id:"stack",n:"포인트 적립",desc:"굴린 합을 계속 더한다. 기회 안에 누적 합이 목표 이상이 되는 순간 통과(진행 막대).",badge:"누적 {acc} / {t}",ease:"T − 2e",fix:"라운드의 마지막 기회에서만. 다시 굴린 눈으로 그 굴림의 합을 바꿔 누적 계산"},{id:"no1",n:"유통기한 검사",desc:"눈 1이 하나라도 나오면 그 굴림은 무효. 1 없이 합이 목표 이상이어야 통과.",badge:"{t} 이상 · 1 나오면 무효",ease:"T − e",fix:"1이 나온 주사위를 다시 굴리는 게 보통 — 같은 목표로 판정"},{id:"parity",n:"홀짝 계산대",desc:"정해진 홀수 · 짝수 합만 인정. 그 합이 목표 이상이어야 통과.",badge:"{par} {t} 이상",ease:"T − 2e (같은 홀짝의 다음 수)",fix:"같은 목표 · 같은 홀짝으로 판정"},{id:"range",n:"가격 맞히기",desc:"합이 목표 ~ 목표+w 사이면 통과. 너무 높아도 실패.",badge:"{t} ~ {t+w}",ease:"e > 0 → 아래 끝 − e(범위 넓어짐) · e < 0 → 위 끝 + e(좁아짐, 폭 최소 0)",note:'위 끝이 있는 유일한 기믹 — 아래 끝은 "이상"',fix:"같은 범위로 판정"},{id:"blind",n:"블라인드 재고",desc:"굴릴 때마다 목표가 T−1 ~ T+1 중 하나로 몰래 정해지고, 굴린 뒤 공개된다.",badge:"? ({t-1}~{t+1}) 이상",ease:"T − e",fix:"이미 공개된 그 기회의 목표로 판정(다시 뽑지 않음)"},{id:"rising",n:"품절 임박",desc:"굴릴 때마다 목표가 1씩 올라간다(k번째 굴림 T+k−1). 첫 굴림이 제일 쉽다.",badge:"{t} 이상 · 굴릴 때마다 +1",ease:"T − e",fix:"그 기회의 목표(T + k − 1) 그대로"},{id:"falling",n:"마감 세일",desc:"굴릴 때마다 목표가 1씩 내려간다(k번째 굴림 T−k+1). 버티면 이긴다.",badge:"{t} 이상 · 굴릴 때마다 −1",ease:"T − e",fix:"그 기회의 목표(T − k + 1) 그대로"},{id:"triple",n:"한 박스 더",desc:"주사위 3개를 굴려 큰 두 개의 합이 목표 이상이면 통과. 가장 작은 눈은 흐리게.",badge:"주사위 3개 · 큰 둘 {t} 이상",ease:"T − e",fix:"세 주사위 중 하나를 다시(보통 가장 작은 눈)"}],gimmickRule:{badge:'badge(rule, {k, acc}) — 지금 기회 k(0부터)와 누적 acc 를 받아 "지금 목표"를 쓴다(품절 임박 · 마감 세일 · 적립)',express:'특급 배송의 "첫 굴림" = 그 매장 첫 라운드의 첫 굴림(다시 굴리기 · 맞짱 무승부 재굴림으로 통과한 것은 제외, 재도전 라운드도 제외). 스페셜 주문(제안)은 첫 굴림과 상관없이 통과하면 첫 카드가 스페셜',sameGimmick:"같은 기믹이 뒤 장에 다시 나오면 목표 숫자는 같거나 오른다. 기회가 함께 늘기도 해서 첫 라운드 통과율은 몇 %p 오르내릴 수 있다(2 · 3일차 기준 1+1 9번 75% → 17번 77%, 마감 세일 5번 76% → 15번 82%, 적립 12번 72% → 19번 76% — 1일차는 모두 한 단계 쉬움) — 난이도 흐름은 장 단위 곡선으로 본다"},ease:{note:'"난이도 n단계 쉬움"(e, 어려움은 음수)을 기믹별로 옮기는 법. 요소 효과와 단골 보정이 같은 함수를 쓴다(effRule).',clamp:{target:[2,12],stackMin:2,vsB:[-3,3],triesMin:1},sources:["그날 난이도(days[d].ease · dK — 1일차 0 · 2 · 3일차 −1, 31번 제외) — 매장에 도착할 때 st.mod 에 들어감","요소 효과(새벽 배송 +2 · 재고 제보 +1 · 야간 특근 −1 · 낚시 제보 −1 · 입고 누락(적립 매장) −1)","단골 보정(같은 매장에서 ♥ 를 잃을 때마다 +1, 최대 +2)"]},elements:[{id:"logi",n:"물류 센터",role:"이 매장 듀얼 규칙을 바꾼다",sprite:"elem_logi",color:"#5b8def",effects:[{id:"delay",n:"빵 전달 지연!",w:40,kind:"duel",param:{rounds:1,bread:1},chip:"지연 2라운드 · 빵 +1",text:"트럭이 꽉 막혔다! 이 매장은 듀얼을 2라운드 이겨야 빵을 준다. 대신 밀린 빵까지 한꺼번에 — 통과하면 빵 +1. 이긴 라운드는 남는다."},{id:"short",n:"입고 누락…",w:20,kind:"duel",param:{tries:-1,stackEase:-1},chip:"기회 −1",text:"박스 하나가 안 왔다. 이 매장 기회 −1(최소 1번). 포인트 적립 매장은 대신 난이도 1단계 어려움."},{id:"dawn",n:"새벽 배송 도착!",w:25,kind:"duel",param:{ease:2},chip:"쉬움 2",text:"갓 들어온 박스가 산더미! 이 매장 난이도 2단계 쉬움."},{id:"express",n:"특급 배송 도착!",w:15,kind:"duel",param:{firstRollSpecial:!0},chip:"첫 굴림 통과 = 스페셜",text:"첫 라운드의 첫 굴림에 바로 통과하면(다시 굴리기 · 무승부 재굴림 제외) 이 매장 포토카드는 스페셜 카드 확정!"}]},{id:"fac",n:"빵 공장",role:"이 매장에서 받는 빵 · 포토카드를 바꾼다(통과해야 받음)",sprite:"elem_fac",color:"#e8a33d",effects:[{id:"error",n:"공장 오류!",w:40,kind:"reward",param:{coin:[2,0],p:.5},chip:"2장 or 0장",text:"포장 기계가 고장 났다! 이번 빵 봉투에는 포토카드가 2장… 아니면 0장? 봉투를 뜯을 때 공개."},{id:"special",n:"스페셜 라인 가동!",w:20,kind:"reward",param:{special:1},chip:"스페셜 확정",text:"오늘은 스페셜 라인! 이번 빵의 포토카드는 스페셜 카드 확정."},{id:"overtime",n:"야간 특근!",w:20,kind:"both",param:{bread:1,ease:-1},chip:"빵 +1 · 어려움 1",text:"공장이 밤새 돌았다! 이 매장을 통과하면 빵 +1. 대신 물건 정리에 바쁜 알바 — 난이도 1단계 어려움."},{id:"fresh",n:"갓 구운 빵 냄새~",w:20,kind:"now",param:{heart:1},chip:"♥ +1",text:"고소한 냄새에 다리에 힘이 난다. 체력 ♥ +1(최대 5)."}]},{id:"rider",n:"배달 기사",role:'빵 빌런 "쌩쌩이"(배달 기사인 척하는 빵 도둑)의 습격 — 즉시 미니게임. 가끔 진짜 기사님이 도와준다',sprite:"elem_rider",color:"#e0584f",effects:[{id:"rps",n:"빵 빌런 등장!",w:40,kind:"mini",param:{game:"rps"},chip:"가위바위보",text:'배달 기사인 척하는 빵 빌런 "쌩쌩이"가 길을 막았다! 가위바위보 — 이기면 쌩쌩이가 떨어뜨린 빵 +1, 지면 가장 최근 포토카드 1장을 뺏긴다.'},{id:"chase",n:"골목 추격전!",w:40,kind:"mini",param:{game:"arrow"},chip:"방향키",text:'"쌩쌩이"가 내 빵 봉투를 낚아채 달아난다! 화살표를 순서대로 눌러 따라잡아라 — 잡으면 봉투를 되찾고 쌩쌩이가 흘린 빵까지 +1, 놓치면 가장 최근 포토카드 1장을 잃는다.'},{id:"ride",n:"진짜 기사님 등장!",w:20,kind:"choice",param:{ride:1},chip:"오토바이?",text:'진짜 배달 기사님이 "타요, 태워 줄게요!" — 타면 이 매장을 듀얼 없이 통과하지만 빵은 못 받는다.'}]},{id:"chat",n:"리마인 단톡방",role:"같은 팬들의 제보 · 응원 · 나눔 — 대부분 도움, 가끔 낚시",sprite:"elem_chat",color:"#b36ad8",effects:[{id:"tip",n:"재고 제보 떴다!",w:30,kind:"duel",param:{ease:1},chip:"쉬움 1",text:'"그 매장 방금 입고됨!!" 알바가 기분이 좋다. 이 매장 난이도 1단계 쉬움.'},{id:"cheer",n:"응원 폭격!",w:20,kind:"now",param:{heart:1},chip:"♥ +1",text:'"할 수 있다 리마인!!" 알림이 멈추지 않는다. 체력 ♥ +1(최대 5).'},{id:"stick",n:"응원봉 나눔!",w:15,kind:"now",param:{stick:1},chip:"황금 카드 +1",text:'"응원봉 여분 있어요!" 황금 카드(응원봉) +1(최대 3). 실패한 굴림에서 주사위 하나를 다시 굴리는 아이템.'},{id:"share",n:"나눔 천사 등장!",w:15,kind:"now",param:{card:1},chip:"포카 +1",text:'"여분 빵 나눔해요~ 편의점 앞으로 오세요!" 포토카드 +1(바로 받음).'},{id:"trade",n:"포카 교환 성사!",w:10,kind:"now",param:{trade:1},chip:"중복 → 새 카드",text:'"그 카드 중복이면 제 거랑 바꿔요!" 중복 카드 1장이 아직 없는 카드로 바뀐다. 중복이 없으면 나눔 포카 +1.'},{id:"fake",n:"낚시 제보…",w:10,kind:"duel",param:{ease:-1},chip:"어려움 1",text:'"거기 빵 산더미래요ㅋㅋ" …낚였다. 몰려든 손님에 알바가 경계한다. 이 매장 난이도 1단계 어려움.'}]}],deal:{n:"알바의 제안",when:"조용한 매장(요소 칸 · 황금 카드 칸 · 보스 · 1일차 1번 제외)에서 흐름 ev:d:i(코스 C)로 p 확률(days[d].dealP 가 있으면 그날 값). 조용한 한 줄 뒤 말풍선 한 줄 + 칩",p:.5,offers:[{id:"greedy",n:"욕심 주문",w:45,param:{ease:-1,bread:1},chip:"어려움 1 · 빵 +1",line:"지금 '도전 행사' 중이에요! 기준을 한 단계 올려도 괜찮으시면, 통과할 때 하나 더 드려요."},{id:"rare",n:"스페셜 주문",w:30,param:{ease:-1,special:1},chip:"어려움 1 · 스페셜 확정",line:"스페셜 카드 봉투는 '도전 행사' 조건으로만 드릴 수 있대요. 기준 한 단계 올려도 될까요?"},{id:"safe",n:"안전 주문",w:25,param:{ease:2,noBread:1},chip:"쉬움 2 · 빵 0",line:"오늘은 '다음에 또 오세요' 쿠폰 행사도 있어요. 기준을 두 단계 낮춰 드리는 대신, 빵은 다음에…"}],keys:{yes:"ArrowUp",no:["Space","Enter"]},rule:"받으면 그 매장을 통과할 때까지 유지(요소 효과와 같음 · 재도전해도 그대로). 안전 주문으로 통과하면 빵 0 · 하나 더요 없음. 거절이 기본(Space)",why:"듀얼에서 플레이어가 고르는 순간을 늘린다 — ♥ 가 넉넉하면 욕심, 위기면 안전. 조용한 매장에만 나와 사건 매장이 복잡해지지 않는다"},fail:{heartName:"체력",start:3,max:5,onFail:"한 라운드(기회 전부)를 지면 체력 ♥ −1 → 같은 매장 재도전(자동 1.2초 · Space 로 바로, 기회는 처음부터, 요소 효과 · 제안 그대로). ♥ 0 → 그 자리에서 끝",pity:{name:"단골 보정",per:1,max:2,text:'같은 매장에서 ♥ 를 잃을 때마다 그 매장 난이도 1단계 쉬움(최대 2). 알바 retry 대사 + "단골 보정" 칩',scope:"매장 단위 — 그 매장을 통과할 때까지 유지(지연 2라운드 · 최종 시험 단계가 바뀌어도 그대로), 다음 매장에서 0"},keep:["빵 전달 지연(2라운드): 이긴 라운드는 남는다 — 남은 라운드만 다시","전설의 점장님: 깬 시험은 남는다(체크포인트)","요소 효과 · 알바의 제안 · 단골 보정은 그 매장을 통과할 때까지 유지","체력 · 포토카드 · 황금 카드는 날을 넘겨 이어진다(♥ 0 이면 그 자리에서 끝)"],crisis:"체력 1 = 위기: 처음 들어갈 때만 하트 두근 + 화면 가장자리 붉게(1.5초), 그 뒤에는 하트 테두리만 붉게 유지(v3: 단톡방 ×2 는 없어짐 — 요소 칸이 보드에 미리 보이므로)",heal:["밤 — 집에서 하룻밤(1 · 2일차 끝) ♥ +3","빵 공장 — 갓 구운 빵 냄새 ♥ +1","리마인 단톡방 — 응원 폭격 ♥ +1","보스(8 · 16 · 24) 비밀 창고 — ♥ +1 을 고를 수 있음"],gameOver:{text:"발바닥에 물집이 잡혔다… 오늘의 빵 원정은 여기까지.",keep:"그때까지 통과한 매장 · 모은 포토카드로 점수"},why:"무한 재도전은 한 매장에서 굴리기만 되풀이해 지루하고, 즉시 게임오버는 운 나쁜 한 라운드에 몇 분이 날아가 가혹하다. ♥ 3개(최대 5)로 실패에 값을 치르게 하되 같은 매장에서 이어 가게 하고, 단골 보정으로 질수록 쉬워져 한 매장에 갇히지 않게 했다. 끝은 여러 매장에 걸친
